meta:
  environment: jvm
  toolchain:
    name: gradle
    version: 21                    # JDK для сборки (gradle:jdk21) и запуска (liberica-openjre:21)

build:
  image: gradle:8.14-jdk21         # та же версия Gradle, что в gradle-wrapper
  args: -x test                    # тесты на Testcontainers — в облачной сборке Docker недоступен
  artifacts:
    "build/libs/*.jar": /          # bootJar → корень приложения

run:
  jarName: velo-backend-0.0.1-SNAPSHOT.jar
  containerPort: 8081
  persistenceMount: /data
